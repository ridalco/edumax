<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visor PDF</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Arial,sans-serif;background:#525659;overflow:hidden}

#toolbar{
  height:46px;background:#3A3A3A;display:flex;align-items:center;
  padding:0 10px;gap:4px;border-bottom:1px solid #222;flex-shrink:0;
}
.tb-btn{background:none;border:1px solid transparent;color:#CCC;cursor:pointer;
  width:32px;height:32px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;font-size:15px;transition:.12s;text-decoration:none;
  flex-shrink:0;line-height:1}
.tb-btn:hover{background:rgba(255,255,255,0.12);border-color:#666;color:#FFF}
.sep{width:1px;height:26px;background:#555;margin:0 3px;flex-shrink:0}
#page-input{width:44px;padding:3px 6px;background:#555;border:1px solid #666;
  border-radius:4px;color:#FFF;font-size:12px;text-align:center;outline:none}
#page-total{color:#AAA;font-size:12px;margin:0 4px;white-space:nowrap}
#zoom-sel{background:#555;border:1px solid #666;border-radius:4px;
  color:#FFF;font-size:12px;padding:3px 5px;cursor:pointer;outline:none;height:28px}
#fname{color:#AAA;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;padding:0 6px}

#viewer{
  height:calc(100vh - 46px);overflow-y:auto;overflow-x:auto;
  display:flex;flex-direction:column;align-items:center;
  padding:12px;gap:10px;
}
.pg{background:white;box-shadow:0 2px 12px rgba(0,0,0,0.5);position:relative;flex-shrink:0}
canvas{display:block}

#overlay{
  position:fixed;inset:0;background:#525659;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:white;z-index:50;
}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,0.2);
  border-top-color:white;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#overlay-msg{font-size:14px;text-align:center;padding:0 1rem}
#overlay-link{display:none;color:#60A5FA;font-size:13px;margin-top:4px;text-decoration:none}
</style>
</head>
<body>

<div id="toolbar">
  <button class="tb-btn" id="btnPrev" title="Anterior">&#8249;</button>
  <input type="number" id="page-input" value="1" min="1">
  <span id="page-total">/ ...</span>
  <button class="tb-btn" id="btnNext" title="Siguiente">&#8250;</button>
  <div class="sep"></div>
  <button class="tb-btn" id="btnZout" title="Alejar">&#8722;</button>
  <select id="zoom-sel">
    <option value="0.5">50%</option>
    <option value="0.75">75%</option>
    <option value="1">100%</option>
    <option value="1.25" selected>125%</option>
    <option value="1.5">150%</option>
    <option value="2">200%</option>
  </select>
  <button class="tb-btn" id="btnZin" title="Acercar">+</button>
  <div class="sep"></div>
  <button class="tb-btn" id="btnRot" title="Rotar">&#8635;</button>
  <div class="sep"></div>
  <span id="fname">PDF</span>
  <button class="tb-btn" id="btnPrint" title="Imprimir">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
  </button>
  <a class="tb-btn" id="btnDown" title="Descargar">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </a>
  <a class="tb-btn" id="btnOpen" title="Abrir en pestaña" target="_blank">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
  </a>
</div>

<div id="viewer"></div>

<div id="overlay">
  <div class="spin" id="spinner"></div>
  <div id="overlay-msg">Cargando PDF...</div>
  <a id="overlay-link" href="#" target="_blank">↗ Abrir directamente</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// Parámetros
const params  = new URLSearchParams(location.search);
const fileUrl = params.get('file') || '';
const nameRaw = decodeURIComponent(fileUrl.split('/').pop() || 'documento.pdf');

document.getElementById('fname').textContent = nameRaw;
document.getElementById('btnDown').href     = fileUrl;
document.getElementById('btnDown').download = nameRaw;
document.getElementById('btnOpen').href     = fileUrl;
document.getElementById('overlay-link').href = fileUrl;

// Estado
let pdf      = null;
let numPages = 0;
let curPage  = 1;
let scale    = 1.25;
let rotation = 0;
let busy     = false;       // semáforo para no renderizar en paralelo

// ── helpers ───────────────────────────────────────────
function setOverlay(msg, showLink = false) {
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  document.getElementById('overlay-msg').textContent = msg;
  document.getElementById('spinner').style.display   = msg === '' ? 'none' : '';
  document.getElementById('overlay-link').style.display = showLink ? '' : 'none';
}
function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

// ── renderizar todas las páginas ──────────────────────
async function renderAll() {
  if (busy || !pdf) return;
  busy = true;

  const viewer = document.getElementById('viewer');
  viewer.innerHTML = '';           // limpiar

  const SCALE = scale;
  const ROT   = rotation;

  for (let i = 1; i <= numPages; i++) {
    let page;
    try {
      page = await pdf.getPage(i);
    } catch (err) {
      console.error('Error página', i, err);
      continue;   // saltar página con error y seguir
    }

    const vp     = page.getViewport({ scale: SCALE, rotation: ROT });
    const wrap   = document.createElement('div');
    wrap.className = 'pg';
    wrap.id        = 'pg-' + i;
    wrap.style.width  = vp.width  + 'px';
    wrap.style.height = vp.height + 'px';

    const canvas = document.createElement('canvas');
    canvas.width  = vp.width;
    canvas.height = vp.height;
    wrap.appendChild(canvas);
    viewer.appendChild(wrap);

    try {
      await page.render({
        canvasContext: canvas.getContext('2d'),
        viewport: vp
      }).promise;
    } catch (err) {
      console.error('Error render página', i, err);
      // Mostrar indicador de error en esa página
      const errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f9f9f9;color:#999;font-size:13px';
      errDiv.textContent = 'Error al renderizar esta página';
      wrap.appendChild(errDiv);
    }
  }

  busy = false;
}

// ── cargar PDF ───────────────────────────────────────
if (!fileUrl) {
  setOverlay('No se especificó archivo', true);
} else {
  pdfjsLib.getDocument({
    url: fileUrl,
    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
    cMapPacked: true,
  }).promise
    .then(doc => {
      pdf      = doc;
      numPages = doc.numPages;
      document.getElementById('page-total').textContent  = '/ ' + numPages;
      document.getElementById('page-input').max          = numPages;
      hideOverlay();
      renderAll();
    })
    .catch(err => {
      console.error(err);
      document.getElementById('spinner').style.display = 'none';
      setOverlay('No se pudo cargar el PDF.\n' + err.message, true);
    });
}

// ── controles ────────────────────────────────────────
const ZOOMS = [0.5, 0.75, 1, 1.25, 1.5, 2];

function scrollToPage(n) {
  const el = document.getElementById('pg-' + n);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('page-input').value = n;
  curPage = n;
}

document.getElementById('btnPrev').onclick = () => {
  if (curPage > 1) scrollToPage(curPage - 1);
};
document.getElementById('btnNext').onclick = () => {
  if (curPage < numPages) scrollToPage(curPage + 1);
};
document.getElementById('page-input').onchange = function () {
  const n = Math.max(1, Math.min(numPages, parseInt(this.value) || 1));
  this.value = n;
  scrollToPage(n);
};

document.getElementById('btnZin').onclick = () => {
  const i = ZOOMS.findIndex(z => z > scale);
  if (i !== -1) { scale = ZOOMS[i]; document.getElementById('zoom-sel').value = scale; renderAll(); }
};
document.getElementById('btnZout').onclick = () => {
  const i = [...ZOOMS].reverse().findIndex(z => z < scale);
  if (i !== -1) { scale = [...ZOOMS].reverse()[i]; document.getElementById('zoom-sel').value = scale; renderAll(); }
};
document.getElementById('zoom-sel').onchange = function () {
  scale = parseFloat(this.value);
  renderAll();
};
document.getElementById('btnRot').onclick = () => {
  rotation = (rotation + 90) % 360;
  renderAll();
};
document.getElementById('btnPrint').onclick = () => window.print();

// Detectar página visible al hacer scroll
document.getElementById('viewer').addEventListener('scroll', function () {
  for (let i = 1; i <= numPages; i++) {
    const el = document.getElementById('pg-' + i);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    if (r.top < window.innerHeight * 0.6 && r.bottom > 0) {
      curPage = i;
      document.getElementById('page-input').value = i;
      break;
    }
  }
}, { passive: true });

// Teclado
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowDown' || e.key === 'PageDown') document.getElementById('btnNext').click();
  if (e.key === 'ArrowUp'   || e.key === 'PageUp'  ) document.getElementById('btnPrev').click();
  if ((e.key === '+' || e.key === '=') && !e.ctrlKey) document.getElementById('btnZin').click();
  if (e.key === '-' && !e.ctrlKey) document.getElementById('btnZout').click();
});
</script>
</body></html>
